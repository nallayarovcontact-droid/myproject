<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BMW Parts World</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="bar">
    <h1>BMW Parts World</h1>
    <form id="search" role="search">
      <input id="q" name="q" type="search" maxlength="100" placeholder="Search parts, SKU, category" autocomplete="off">
      <button type="submit">Search</button>
    </form>
  </header>
  <main>
    <p id="status" aria-live="polite"></p>
    <ul id="grid" class="grid"></ul>
  </main>
  <template id="card">
    <li class="card">
      <img alt="" loading="lazy" width="320" height="240">
      <h2 class="name"></h2>
      <p class="sku"></p>
      <p class="desc"></p>
      <p class="price"></p>
    </li>
  </template>
</body>
</html>
