<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin · BMW Parts World</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/admin/admin.css">
  <script src="/admin/app.js" defer></script>
</head>
<body>
  <header class="bar">
    <h1>Catalog admin</h1>
    <div><span id="who"></span> <button id="logout" class="secondary" type="button">Sign out</button></div>
  </header>
  <main>
    <section class="panel">
      <h2 id="form-title">New product</h2>
      <form id="product-form" class="stack">
        <input type="hidden" name="id">
        <label>Name <input name="name" required maxlength="200"></label>
        <label>Part number (SKU) <input name="sku" maxlength="64" pattern="[A-Za-z0-9._\-]+"></label>
        <label>Category <input name="category" maxlength="100"></label>
        <label>Price <input name="price" type="number" min="0" max="1000000" step="0.01" required></label>
        <label>Stock <input name="stock" type="number" min="0" max="1000000" step="1" value="0"></label>
        <label>Description <textarea name="description" rows="3" maxlength="5000"></textarea></label>
        <label>Photo (JPEG, PNG or WebP, max 5 MB) <input name="photo" type="file" accept="image/jpeg,image/png,image/webp"></label>
        <p id="form-error" class="error" role="alert"></p>
        <div class="row">
          <button type="submit">Save</button>
          <button type="reset" class="secondary" id="cancel">Clear</button>
        </div>
      </form>
    </section>
    <section class="panel">
      <form id="search" role="search"><input id="q" type="search" maxlength="100" placeholder="Filter"><button>Filter</button></form>
      <table>
        <thead><tr><th>Photo</th><th>Name</th><th>SKU</th><th>Price</th><th>Stock</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
  </main>
</body>
</html>
